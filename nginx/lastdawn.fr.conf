# nginx site config for lastdawn.fr — serves the Vue SPA at the apex domain.
#
# This REPLACES the previous static site (/var/www/lastdawn.fr). It reuses the
# existing Certbot certificate for lastdawn.fr, so no new cert is needed.
#
# Install on the VPS (one time), disabling the old site config:
#
#   sudo cp /opt/dnd/nginx/lastdawn.fr.conf /etc/nginx/sites-available/lastdawn.fr
#   sudo rm -f /etc/nginx/sites-enabled/dnd.conf      # retire the old server_name _ block
#   sudo nginx -t && sudo systemctl reload nginx
#
# (/etc/nginx/sites-enabled/lastdawn.fr already symlinks to sites-available/lastdawn.fr.)
#
# The deploy workflow ships the built SPA to /opt/dnd/frontend-dist; nginx serves
# those files directly, so no reload is needed on each deploy — only re-run the
# steps above when THIS config changes.
#
# It has changed, and this time the reinstall is required rather than merely
# advisable: /config.js below is new, and the SPA refuses to start without it.
# The file it points at has to exist first:
#
#   sudo mkdir -p /opt/dnd/config
#   echo 'window.__CONFIG__ = { apiUrl: "https://api.lastdawn.fr" }' \
#     | sudo tee /opt/dnd/config/config.js
#
# Both of those are host state, written once and then left alone — the deploy
# never touches either. They are the first things to move into Ansible when that
# happens; until then they are two commands and this comment.
#
# The SPA calls the API at https://api.lastdawn.fr (its own server block, already
# present), which is why CORS_ORIGINS must include https://lastdawn.fr. It learns
# that address from /config.js at boot rather than having it compiled in.

server {
    server_name lastdawn.fr www.lastdawn.fr;

    # Static SPA shipped by the deploy workflow (scp -> frontend-dist).
    root /opt/dnd/frontend-dist;
    index index.html;

    # Entry point: never cache — it references the hashed asset filenames, so a
    # stale index.html would load old/missing assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime configuration: the one file the SPA loads that is not the same in
    # every environment, which is exactly why it is not part of the build.
    #
    # Served from outside the document root deliberately. The deploy replaces
    # frontend-dist wholesale (scp with rm: true), so a config.js living in there
    # would be deleted on every deploy and have to be rewritten afterwards — an
    # ordering dependency, and a deploy step that only exists to undo the deploy.
    # Out here it is machine state: written once, owned by whatever configures
    # this host, and untouched by shipping a new build.
    #
    # Never cache: unlike /assets/ below it carries no content hash, so a cached
    # copy would keep pointing the app at yesterday's API host with no way to
    # invalidate it short of a name change.
    location = /config.js {
        alias /opt/dnd/config/config.js;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are content-addressed (Vite fingerprints them), so a
    # stale cache is impossible — cache them immutably for performance.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router / SPA fallback: unknown paths return index.html (which
    # re-matches the location above, inheriting the no-cache header).
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lastdawn.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lastdawn.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.lastdawn.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = lastdawn.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name lastdawn.fr www.lastdawn.fr;
    return 404; # managed by Certbot
}