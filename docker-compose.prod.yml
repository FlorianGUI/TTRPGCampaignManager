services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    restart: unless-stopped
    ports:
      # Bound to loopback, not 0.0.0.0. nginx proxies to 127.0.0.1:8000 from the same host,
      # so it still reaches this — but nothing on the internet does. Published on all
      # interfaces, as it was, the API answered directly on port 8000 over plain HTTP,
      # skipping TLS and the proxy entirely (the container logs were full of scanners that
      # had found it). It is also what makes trusting X-Forwarded-For below safe: only the
      # proxy can reach the app, so nobody can arrive with a forged one.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Mail (#38). No defaults for the first three: a deployment that forgets them should
      # fail loudly at startup rather than send from the wrong address or not at all.
      BREVO_API_KEY: ${BREVO_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      VERIFY_EMAIL_URL: ${VERIFY_EMAIL_URL:-https://lastdawn.fr/verify-email}
      VERIFICATION_TOKEN_EXPIRE_HOURS: ${VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://lastdawn.fr/reset-password}
      PASSWORD_RESET_EXPIRE_HOURS: ${PASSWORD_RESET_EXPIRE_HOURS:-1}
      FORGOT_PASSWORD_RATE_LIMIT: ${FORGOT_PASSWORD_RATE_LIMIT:-5/hour}
      RESENDS_PER_SESSION: ${RESENDS_PER_SESSION:-3}
      RESEND_COOLDOWN_SECONDS: ${RESEND_COOLDOWN_SECONDS:-120}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5/hour}
      # Sign in with Discord (#39). No defaults for the credentials, like the mail keys
      # above: a deployment that forgets them should fail where it is obvious rather than
      # offer a button that cannot work.
      #
      # DISCORD_REDIRECT_URI must match a URI registered in the Discord developer portal
      # character for character — Discord compares strings, not hosts — and it is never
      # derived from the incoming request, because a redirect URI a caller could influence
      # is an open redirect with an authorization code attached to it.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://api.lastdawn.fr/auth/discord/callback}
      # Where the callback hands the browser back to. A page in the SPA, which turns the
      # refresh cookie it was just given into an access token — which is what keeps the
      # token out of the URL, and so out of history and every proxy log on the way.
      # Sign in with Google (#36). Same shape as Discord: credentials with no default, and
      # a redirect URI that must match the Cloud console entry character for character.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.lastdawn.fr/auth/google/callback}
      # Shared by every provider: what happens after a sign-in does not depend on which one
      # it was, so there is one landing page and one variable naming it.
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:-https://lastdawn.fr/auth/callback}
      # Whose X-Forwarded-For uvicorn believes. Nothing here reaches it from 127.0.0.1 — the
      # published port above is forwarded by docker-proxy, so the peer is the bridge gateway
      # (172.18.0.1 today). uvicorn's default of 127.0.0.1 therefore trusts nobody and the
      # header is dropped, leaving every caller keyed on that one gateway address.
      #
      # The whole private /12 rather than the gateway itself, because Docker picks the
      # subnet and renumbers it whenever the network is recreated — pinning 172.18.0.1 would
      # silently revert to one-shared-bucket on the day that changed. Trusting the range is
      # safe here precisely because of the loopback binding above: the only thing that can
      # reach this container is docker-proxy relaying from nginx.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: