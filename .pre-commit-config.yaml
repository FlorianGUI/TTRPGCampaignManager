repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && poetry run mypy .'
        language: system
        files: ^backend/
        pass_filenames: false
        types: [python]

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && npm run lint:fix'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-prettier
        name: frontend prettier
        entry: bash -c 'cd frontend && npm run format'
        language: system
        files: ^frontend/
        pass_filenames: false