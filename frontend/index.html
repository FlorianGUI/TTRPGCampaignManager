<!doctype html>
<!--
  `lang` is English until the app says otherwise: src/i18n resolves the locale
  from the browser and writes it onto this element before the first render (#87).
  A value here rather than none, because this file is what a crawler and an
  assistive technology read if the module never runs at all.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTRPG Campaign Manager</title>
    <!--
      Runtime configuration, written on the server at deploy time and served
      no-cache. Deliberately a plain blocking script and not a module: it has to
      have run before the app's first import reads window.__CONFIG__.

      In development the Vite server answers this from vite.config.js, so the
      shape is the same in both places rather than only existing in production.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
