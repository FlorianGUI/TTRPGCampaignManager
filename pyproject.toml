[tool.poetry]
name = "dnd-character-sheet-creator"
version = "0.1.0"
description = "D&D Character Sheet Creator API"
authors = ["Florian Guillet <florian.guillet@tenacy.io>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.136.0"
pydantic = "^2.0"
uvicorn = {extras = ["standard"], version = "^0.47.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.31.0"
alembic = "^1.18.0"
slowapi = "^0.1.9"
bcrypt = "^5.0.0"
pyjwt = "^2.13.0"
python-multipart = "^0.0.32"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
httpx = "^0.28.0"
pytest-asyncio = "^1.3.0"
pytest-bdd = "^8.0"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]
core = "sysmon"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"