# nginx site config for lastdawn.fr — serves the Vue SPA at the apex domain.
#
# This REPLACES the previous static site (/var/www/lastdawn.fr). It reuses the
# existing Certbot certificate for lastdawn.fr, so no new cert is needed.
#
# Install on the VPS (one time), disabling the old site config:
#
#   sudo cp /opt/dnd/nginx/lastdawn.fr.conf /etc/nginx/sites-available/lastdawn.fr
#   sudo rm -f /etc/nginx/sites-enabled/dnd.conf      # retire the old server_name _ block
#   sudo nginx -t && sudo systemctl reload nginx
#
# (/etc/nginx/sites-enabled/lastdawn.fr already symlinks to sites-available/lastdawn.fr.)
#
# The deploy workflow ships the built SPA to /opt/dnd/frontend-dist; nginx serves
# those files directly, so no reload is needed on each deploy — only re-run the
# steps above when THIS config changes.
#
# It has just changed: the /api proxy below is new, and the SPA that ships with
# it calls /api rather than api.lastdawn.fr. Copy and reload before — or with —
# that deploy, or the app loads and every request under /api 404s against the
# SPA fallback.
#
# The SPA calls the API at a same-origin /api, proxied below. api.lastdawn.fr
# keeps its own server block for Swagger and direct access, but the browser no
# longer uses it — so CORS is off the hot path for the app itself.

server {
    server_name lastdawn.fr www.lastdawn.fr;

    # Static SPA shipped by the deploy workflow (scp -> frontend-dist).
    root /opt/dnd/frontend-dist;
    index index.html;

    # Entry point: never cache — it references the hashed asset filenames, so a
    # stale index.html would load old/missing assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are content-addressed (Vite fingerprints them), so a
    # stale cache is impossible — cache them immutably for performance.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, same-origin. This is what keeps the API host out of the bundle:
    # the SPA requests /api/... relative to wherever it is served, so one build
    # artifact is correct in every environment and no VITE_API_URL is baked in.
    #
    # The prefix matters beyond tidiness. Backend routes are top-level (/users,
    # and /campaigns, /characters as those contexts land) and so are the SPA's
    # own routes — proxying them unprefixed would mean the API shadowing the
    # page of the same name, one context at a time.
    #
    # The trailing slash on proxy_pass strips /api, so /api/users/login reaches
    # the backend as /users/login: it stays unaware it is behind a prefix, and
    # api.lastdawn.fr keeps serving the identical paths.
    #
    # Which is exactly why proxy_cookie_path is not optional. The refresh cookie
    # comes back scoped Path=/users, a path the browser will never send to under
    # /api — so without this line the cookie is stored and then silently never
    # presented, and every session ends at the first reload.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_cookie_path /users /api/users;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router / SPA fallback: unknown paths return index.html (which
    # re-matches the location above, inheriting the no-cache header).
    #
    # /api/ is a longer prefix, so it wins over this regardless of order.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lastdawn.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lastdawn.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.lastdawn.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = lastdawn.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name lastdawn.fr www.lastdawn.fr;
    return 404; # managed by Certbot
}