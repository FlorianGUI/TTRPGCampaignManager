# nginx site config for api.lastdawn.fr — reverse proxy in front of the FastAPI container.
#
# This block already existed on the VPS and was never tracked here, which is how it came to
# be missing X-Forwarded-For without anyone noticing (#61). Committing it means the proxy
# headers the rate limiter depends on are part of the repo rather than part of one machine.
#
# It reuses the existing Certbot certificate for lastdawn.fr, so no new cert is needed.
#
# Install on the VPS (one time, and again whenever THIS file changes):
#
#   sudo cp /opt/dnd/nginx/api.lastdawn.fr.conf /etc/nginx/sites-available/api.lastdawn.fr
#   sudo nginx -t && sudo systemctl reload nginx
#
# (/etc/nginx/sites-enabled/api.lastdawn.fr already symlinks to sites-available/api.lastdawn.fr.)

server {
    server_name api.lastdawn.fr;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # The app is a container and nginx is on the host, so every request reaches uvicorn
        # from the Docker bridge gateway (172.x.0.1) rather than from the caller. Without
        # these, `request.client.host` is that gateway address for everyone, and the rate
        # limiter in app/common/security/rate_limiter.py keys every caller in the world into
        # one shared bucket — which looks exactly like a working limiter until two people
        # use the app at once.
        #
        # X-Forwarded-For is the one that matters and the one that was missing: uvicorn's
        # proxy-header middleware reads it and ignores X-Real-IP entirely, so the X-Real-IP
        # line that was here on its own did nothing. It stays because other tooling reads it.
        #
        # `$proxy_add_x_forwarded_for` appends rather than sets, which is correct here only
        # because nothing untrusted can reach this block — see FORWARDED_ALLOW_IPS in
        # docker-compose.prod.yml for the other half, which decides whose header uvicorn
        # believes. Both halves are required; either alone is a no-op.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lastdawn.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lastdawn.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.lastdawn.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.lastdawn.fr;
    return 404; # managed by Certbot
}
