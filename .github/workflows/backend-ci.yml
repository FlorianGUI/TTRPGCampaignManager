name: Backend CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ttrpg-app:ci backend

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Run mypy
        run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd -d dnd_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dnd:dnd@localhost:5432/dnd_db
      # Dropped, recreated and migrated by the test suite itself. A dev/CI setting only —
      # production leaves it unset, which is what stops the suite running against a real database.
      TEST_DATABASE_URL: postgresql+asyncpg://dnd:dnd@localhost:5432/dnd_db_test
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run migrations
        run: poetry run alembic upgrade head
      - name: Run tests
        run: poetry run pytest
      # CI gets a fresh database every run, so on its own it can never catch tests that
      # leak state and only break on a developer's persistent volume (issue #22). Running
      # the suite a second time against the database the first run just used does.
      - name: Run tests again to check they are isolated
        run: poetry run pytest
