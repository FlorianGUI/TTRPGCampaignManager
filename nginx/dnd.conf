# Reference nginx site config for the VPS ("lastdawn").
#
# This is NOT applied automatically by the deploy workflow. Install it once,
# by hand, on the server:
#
#   sudo cp /opt/dnd/nginx/dnd.conf /etc/nginx/sites-available/dnd.conf
#   sudo ln -sf /etc/nginx/sites-available/dnd.conf /etc/nginx/sites-enabled/dnd.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The deploy workflow only ships the built SPA to /opt/dnd/frontend-dist;
# nginx serves those files directly, so no reload is needed on each deploy —
# only re-run the steps above when THIS config changes.

server {
    listen 80;
    server_name _;

    # Static SPA shipped by the deploy workflow (actions/scp -> dist/).
    root /opt/dnd/frontend-dist;
    index index.html;

    # Vue Router / SPA fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API is proxied to the FastAPI container (published on :8000).
    # /api/characters -> http://127.0.0.1:8000/characters
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}